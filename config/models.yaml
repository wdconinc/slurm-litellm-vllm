defaults:
  vllm:
    image: "docker://vllm/vllm-openai:v0.29.0"
    download_dir: "/project/6041615/models"
    singularity_cache: "/project/6041615/singularity_cache"
    host: "127.0.0.1"
    port: 8000
    sing_bind: "/project/6041615"
  litellm:
    port: 4000
  watchdog:
    max_idle_mins: 15

qwen:
  fullname: "Qwen/Qwen3-Coder-Next"
  slurm:
    partition: "lgpu"
    nodes: 1
    gpus_per_node: 2
    cpus_per_task: 64
    mem: "128G"
    time: "04:00:00"
  vllm:
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser qwen3_xml"
      - "--max-model-len 131072"
      - "--gpu-memory-utilization 0.95"
      - "--quantization fp8"
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"
      - "--trust-remote-code"


smollm-cpu:
  fullname: "HuggingFaceTB/SmolLM-135M-Instruct"
  slurm:
    partition: "skylake"
    nodes: 1
    gpus_per_node: 0
    cpus_per_task: 2
    mem: "16G"
    time: "01:00:00"
  vllm:
    image: "docker://vllm/vllm-openai-cpu:latest-x86_64"
    args:
      - "--gpu-memory-utilization 0.1"
      - "--max-model-len 2048"
      - "--enforce-eager"

