# Pre-configured models with validated HPC and vLLM settings

qwen:
  fullname: "Qwen/Qwen3-Coder-Next"
  slurm:
    partition: "lgpu"
    gpus_per_node: 2
    cpus_per_task: 64
  vllm:
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_xml"
      - "--max-model-len"
      - "131072"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--quantization"
      - "fp8"
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"
      - "--trust-remote-code"

mistral:
  fullname: "sahilchachra/Leanstral-1.5-119B-A6B-NVFP4"
  slurm:
    partition: "lgpu"
    gpus_per_node: 2
    cpus_per_task: 64
  vllm:
    args:
      - "--limit-mm-per-prompt"
      - '{"image": 0}'
      - "--quantization"
      - "compressed-tensors"
      - "--max-model-len"
      - "32764"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--tokenizer-mode"
      - "mistral"
      - "--tool-call-parser"
      - "mistral"
      - "--reasoning-parser"
      - "mistral"

smollm-cpu:
  fullname: "HuggingFaceTB/SmolLM-135M-Instruct"
  slurm:
    partition: "skylake"
    gpus_per_node: 0
    cpus_per_task: 2
  vllm:
    args:
      - "--max-model-len"
      - "2048"
      - "--enforce-eager"

# Aliases
qwen3: "qwen"
leanstral: "mistral"
