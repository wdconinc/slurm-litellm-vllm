name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: pytest (offline tests only; the others need a live endpoint or a real cluster)
        run: uvx --with requests --with pyyaml pytest -q tests/test_job_metrics.py tests/test_start_time.py
      - name: shellcheck the CI scripts
        run: shellcheck ci/slurm/e2e.sh ci/slurm/bin/singularity

  slurm-e2e:
    name: end-to-end on a Slurm cluster (smollm-cpu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # slurm-docker-cluster release 3.0.0 and its published image, pinned together.
      SDC_REF: 3.0.0
      SDC_IMAGE: giovtorres/slurm-docker-cluster:26.05.2-3.0.0
      SLURM_VERSION: 26.05.2
      DOCKER_CLI_VERSION: 27.5.1
      VLLM_IMAGE: vllm/vllm-openai-cpu:latest-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Fetch slurm-docker-cluster ${{ env.SDC_REF }}
        run: git clone --depth 1 --branch "$SDC_REF" https://github.com/giovtorres/slurm-docker-cluster "$RUNNER_TEMP/sdc"

      - name: Pull images (cluster, and the vLLM image the job will run)
        run: |
          docker pull "$SDC_IMAGE"
          docker tag "$SDC_IMAGE" "slurm-docker-cluster:$SLURM_VERSION"
          docker pull "$VLLM_IMAGE"

      - name: Static Docker client for the compute nodes
        run: |
          curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz" \
            | tar -xz -C "$RUNNER_TEMP" docker/docker
          echo "CI_DOCKER_CLI=$RUNNER_TEMP/docker/docker" >> "$GITHUB_ENV"

      - name: Start the cluster (one CPU node)
        working-directory: ${{ runner.temp }}/sdc
        run: |
          printf 'SLURM_VERSION=%s\nCPU_WORKER_COUNT=1\n' "$SLURM_VERSION" > .env
          docker compose -f docker-compose.yml -f "$GITHUB_WORKSPACE/ci/slurm/compose.override.yml" \
            up -d --no-build mysql slurmdbd slurmctld cpu-worker
          timeout 180 bash -c 'until docker compose ps slurmctld | grep -q healthy; do sleep 3; done'
          timeout 180 bash -c 'until docker exec slurmctld sinfo -h -o "%t" | grep -q idle; do sleep 3; done'
          docker exec slurmctld sinfo
          docker exec slurmctld scontrol show node | grep -E 'NodeName|CPUTot|RealMemory'

      - name: Stage the repository and uv on the shared /data
        run: |
          docker exec slurmctld mkdir -p /data/bin
          docker cp "$GITHUB_WORKSPACE/." slurmctld:/data/repo
          docker cp "$(command -v uv)" slurmctld:/data/bin/uv

      - name: End-to-end test
        run: docker exec slurmctld bash /data/repo/ci/slurm/e2e.sh

      - name: Diagnostics
        if: failure()
        working-directory: ${{ runner.temp }}/sdc
        run: |
          docker exec slurmctld bash -c 'tail -n 300 /data/repo/vllm_*.log; tail -n 50 /data/ci/start.log' || true
          docker exec slurmctld bash -c 'squeue; sacct -a --format=JobID,State,ExitCode,Elapsed,NodeList' || true
          docker ps -a
          docker compose logs --tail 100 slurmctld cpu-worker || true
